services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gaming_room
      POSTGRES_USER: gaming_room
      POSTGRES_PASSWORD: gaming_room
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming_room -d gaming_room"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gaming_room:gaming_room@postgres:5432/gaming_room
      JWT_SECRET: change-this-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: